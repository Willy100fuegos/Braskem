        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        /* LAYOUT STRUCTURE */
        .app-container { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        /* SIDEBAR (RESPONSIVE FIX) */
        .sidebar { 
            width: 300px; 
            background-color: #0f172a; 
            color: #cbd5e1; 
            display: flex; 
            flex-direction: column; 
            z-index: 3000; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.3); 
            flex-shrink: 0;
            /* Mobile State: Fixed & Hidden */
            position: absolute;
            top: 0; bottom: 0; left: 0;
            height: 100dvh; /* FIX: Dynamic Height for Mobile Browsers */
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        
        /* Desktop State */
        @media (min-width: 768px) {
            .sidebar { position: relative; transform: translateX(0); height: 100%; }
            .mobile-overlay { display: none !important; }
        }

        .sidebar.open { transform: translateX(0); }
        
        /* Mobile Overlay */
        .mobile-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 2500; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .mobile-overlay.show { opacity: 1; pointer-events: auto; }

        /* MAP CONTAINER */
        .map-wrapper { position: relative; height: 100%; width: 100%; flex: 1; z-index: 1; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; height: 100%; width: 100%; background: #e2e8f0; z-index: 0; }
        
        /* CUSTOM ICONS */
        .custom-div-icon { background: transparent; border: none; }
        .icon-marker-bg {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
        }
        .icon-marker-bg:hover { transform: scale(1.2); z-index: 1000; }

        /* SCROLLBARS & MOBILE SCROLL FIX */
        .custom-scrollbar { 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            overscroll-behavior: contain; /* Prevents body scroll chaining */
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* UI ELEMENTS */
        .section-header { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 6px; display: flex; align-items: center; }
        
        /* Route Image Styling */
        .route-image-container {
            width: 100%;
            height: 180px;
            background-color: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            position: relative;
        }
        .route-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .route-image:hover { transform: scale(1.03); }

        /* Panel Animation */
        #info-panel { transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        
        /* Nav Button Style */
        .nav-btn {
            display: inline-block;
            background-color: #3b82f6;
            color: white !important;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none !important;
            font-size: 11px;
            font-weight: 600;
            margin-top: 12px;
            text-align: center;
            width: 100%;
            transition: background-color 0.2s;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }
        .nav-btn:hover { background-color: #2563eb; }
        
        /* Select Input Style */
        select {
            background-image: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>

            let borderClass = "border-slate-500";
            
            if(item.type === 'Medical' || item.type === 'Emergency') { colorClass = "text-red-600"; bgClass = "bg-red-100"; borderClass="border-red-500"; }
            else if(item.type === 'Military' || item.type === 'Police') { colorClass = "text-blue-700"; bgClass = "bg-blue-100"; borderClass="border-blue-500"; }
            else if(item.type === 'Dining') { colorClass = "text-emerald-600"; bgClass = "bg-emerald-100"; borderClass="border-emerald-500"; }
            else if(item.type === 'Lodging') { colorClass = "text-amber-600"; bgClass = "bg-amber-100"; borderClass="border-amber-500"; }

            const html = `
                <div class="border-l-4 ${borderClass} pl-4 mb-4">
                    <h3 class="font-bold text-lg text-gray-900">${item.name}</h3>
                    <span class="text-xs font-bold ${colorClass} ${bgClass} px-2 py-1 rounded">${item.type}</span>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-white p-3 rounded border border-slate-200 shadow-sm">
                        <p class="text-[10px] text-slate-400 uppercase font-bold"><i class="fas fa-plane mr-1"></i> From Airport</p>
                        <p class="text-sm font-bold text-slate-700">${distAp}</p>
                    </div>
                    <div class="bg-white p-3 rounded border border-slate-200 shadow-sm">
                        <p class="text-[10px] text-slate-400 uppercase font-bold"><i class="fas fa-industry mr-1"></i> To Braskem</p>
                        <p class="text-sm font-bold text-slate-700">${distPlant}</p>
                    </div>
                </div>
                <div class="bg-slate-100 p-4 rounded-lg">
                    <h4 class="font-bold text-slate-800 text-xs uppercase mb-2"><i class="fas fa-clipboard-check mr-2"></i> Intelligence Notes</h4>
                    <p class="text-xs text-slate-600">${item.desc}</p>
                </div>
                
                <a href="https://www.google.com/maps/dir/?api=1&destination=${item.coords[0]},${item.coords[1]}" target="_blank" class="nav-btn">
                    <i class="fas fa-location-arrow mr-1"></i> NAVIGATE HERE
                </a>
            `;
            
            openPanel(item.name, html);
            
            // Draw temporary line
            layers.routes.clearLayers();
            // Optional: Draw line to airport/plant for visual context
        }

        function renderMarkers(data) {
            data.forEach(item => {
                const m = L.marker(item.coords, { icon: item.icon }).addTo(layers.pois);
                
                // NEW: Click event replaces Popup
                m.on('click', () => {
                    openItemPanel(item);
                });
            });
        }

        // Generic Path Drawer
        function drawGenericPath(points, color) {
            return L.polyline(points, {
                color: color, weight: 4, opacity: 0.8, dashArray: '8, 12', lineCap: 'round'
            }).addTo(layers.routes);
        }

        // Initial Render
        renderMarkers(assets); renderMarkers(security); renderMarkers(health); renderMarkers(restaurants);

        // Toggles
        const toggle = (id, data) => document.getElementById(id).addEventListener('change', e => {
            layers.pois.clearLayers();
            if(document.getElementById('layer-assets').checked) renderMarkers(assets);
            if(document.getElementById('layer-security').checked) renderMarkers(security);
            if(document.getElementById('layer-health').checked) renderMarkers(health);
            if(document.getElementById('layer-food').checked) renderMarkers(restaurants);
            closeSidebarMobile(); // Auto close if they toggle layers on mobile
        });
        toggle('layer-assets', assets); toggle('layer-security', security); toggle('layer-health', health); toggle('layer-food', restaurants);

        // 1. MAIN ROUTE CONTROLLER
        document.getElementById('main-route-selector').addEventListener('change', (e) => {
            const val = e.target.value;
            layers.routes.clearLayers();
            document.getElementById('restaurant-selector').value = "";
            document.getElementById('hotel-selector').value = "";
            
            let color, data;

            if (val === 'r_malecon') { color = '#3b82f6'; data = tacticalAnalysis.r_malecon; }
            else if (val === 'r_lasmatas') { color = '#f97316'; data = tacticalAnalysis.r_lasmatas; }
            else if (val === 'r_coatza2') { color = '#a855f7'; data = tacticalAnalysis.r_coatza2; }
            
            if(val) {
                const poly = drawGenericPath([AIRPORT_COORDS, BRASKEM_COORDS], color);
                map.fitBounds(poly.getBounds(), { padding: [80, 80] });
                showAnalysis(data);
                closeSidebarMobile(); // UX Fix
            }
        });

        // 2. HOTEL & RESTAURANT CONTROLLERS (Updated to use new logic)
        document.getElementById('hotel-selector').addEventListener('change', (e) => handleSelectorChange(e.target.value, assets));
        document.getElementById('restaurant-selector').addEventListener('change', (e) => handleSelectorChange(e.target.value, restaurants));

        function handleSelectorChange(val, list) {
            if(!val) return;
            const item = list.find(i => i.id === val);
            if(item) {
                // Center map
                map.flyTo(item.coords, 14, { duration: 1.5 });
                // Show panel
                openItemPanel(item);
            }
        }

        // DISPLAY FUNCTIONS
        function showAnalysis(data) {
            const html = `
                <div class="route-image-container" onclick="window.open('${data.image}', '_blank')">
                    <img src="${data.image}" class="route-image" alt="Route Map">
                    <div class="absolute bottom-2 right-2 bg-black/50 text-white text-[9px] px-2 py-1 rounded">Click to Enlarge</div>
                </div>
                <div class="border-l-4 ${data.riskColor.replace('text', 'border')} pl-4 mb-4">
                    <h3 class="font-bold text-lg text-gray-900">${data.title}</h3>
                    <span class="text-xs font-bold ${data.riskColor} bg-slate-100 px-2 py-1 rounded uppercase">Risk Level: ${data.risk}</span>
                </div>
                <p class="mb-4 text-xs italic text-slate-500">${data.summary}</p>
                <div class="space-y-4">
                    <div class="bg-emerald-50 p-3 rounded border border-emerald-100">
                        <h4 class="font-bold text-emerald-800 text-[10px] uppercase mb-2">Advantages</h4>
                        <ul class="list-disc list-inside text-[11px] text-emerald-900 space-y-1">${data.advantages.map(a => `<li>${a}</li>`).join('')}</ul>
                    </div>
                    <div class="bg-rose-50 p-3 rounded border border-rose-100">
                        <h4 class="font-bold text-rose-800 text-[10px] uppercase mb-2">Tactical Risks</h4>
                        <ul class="list-disc list-inside text-[11px] text-rose-900 space-y-1">${data.risks.map(r => `<li>${r}</li>`).join('')}</ul>
                    </div>
                </div>`;
            openPanel(data.title, html);
        }
    </script>
</body>
</html>
